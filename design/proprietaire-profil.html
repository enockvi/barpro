<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3322">
<title>App Propriétaire — Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--lime:#8BFA5A;--forest:#0B3322;--forest-deep:#06231A;--mid:#1F5C3F;--paper:#F5F8F3;--white:#fff;--ink:#0B1F16;--muted:#5E7266;--line:#DCE6DD;--amber:#F5B841;--coral:#FF6B5B;--lime-soft:#D9FBC8;
--font:"Inter",-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--shadow:0 1px 2px rgba(11,31,22,.06),0 8px 24px rgba(11,31,22,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:15px;line-height:22px;color:var(--ink);background:#E9EEE9;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;cursor:pointer}
input{cursor:text}
.hide{display:none!important}
.demo-bar{max-width:390px;margin:0 auto;padding:16px 0 12px;display:flex;flex-direction:column;gap:8px}
.demo-bar label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.demo-bar select{height:40px;border-radius:999px;border:0;background:var(--white);box-shadow:var(--shadow);padding:0 16px;font-size:14px;outline:none}
.phone{width:390px;height:844px;max-width:100%;margin:0 auto;background:var(--paper);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(6,35,26,.25),0 0 0 10px #0B1F16;display:flex;flex-direction:column}
@media (max-width:440px){.phone{border-radius:0;box-shadow:none;height:100vh;height:100dvh}}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:600}
.topbar{display:flex;align-items:center;gap:10px;padding:4px 20px 12px}
.topbar button{width:40px;height:40px;border-radius:50%;border:0;background:var(--white);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.topbar h1{font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.03em;color:var(--forest-deep)}
.content{flex:1;overflow-y:auto;padding:0 20px 28px}
.hero{background:var(--forest);color:var(--white);border-radius:24px;padding:20px;margin-bottom:16px;display:flex;gap:14px;align-items:center}
.hero .av{width:56px;height:56px;border-radius:18px;background:var(--lime);display:grid;place-items:center;color:var(--forest-deep);font-weight:800;font-size:20px;flex:none}
.hero b{font-size:17px;display:block}
.hero small{font-size:13px;opacity:.75}
.group{background:var(--white);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .ri{width:34px;height:34px;border-radius:12px;background:var(--paper);display:grid;place-items:center;flex:none}
.row .ri svg{width:18px;height:18px;stroke:var(--forest-deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row .rt{flex:1}
.row .rt b{display:block;font-size:15px;font-weight:600}
.row .rt small{font-size:12px;color:var(--muted)}
.row .chev{color:var(--muted);font-size:18px}
.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);font-weight:700;margin:6px 0 8px 4px}
.card{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card b{display:block;font-size:16px;margin-bottom:4px}
.card p{color:var(--muted);font-size:14px;line-height:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--forest-deep)}
.input{width:100%;height:50px;border-radius:14px;border:0;background:var(--white);box-shadow:inset 0 0 0 1px var(--line);padding:0 16px;font-size:16px;outline:none}
.input:focus{box-shadow:inset 0 0 0 2px var(--mid),0 0 0 4px rgba(139,250,90,.35)}
.input:disabled{background:var(--paper);color:var(--muted)}
.input.mono{font-family:var(--mono)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 20px;border-radius:999px;border:0;font-weight:600;font-size:15px;margin-top:10px}
.btn-primary{background:var(--lime);color:var(--forest-deep)}
.btn-dark{background:var(--forest);color:var(--white)}
.btn-ghost{background:transparent;color:var(--forest-deep);box-shadow:inset 0 0 0 1.5px var(--forest-deep)}
.btn-danger{background:#FFE1DD;color:#9A2A1E}
.btn-wa{background:#25D366;color:#fff}
.btn-sm{min-height:38px;font-size:13px;width:auto;padding:0 14px;margin:0}
.btn:disabled{opacity:.4}
.notice{border-radius:18px;padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:20px;display:flex;gap:10px;align-items:flex-start}
.notice svg{width:20px;height:20px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.n-warn{background:#FDF0CF;color:#7A5300}
.n-err{background:#FFE1DD;color:#9A2A1E}
.n-ok{background:var(--lime-soft);color:var(--forest-deep)}
.n-info{background:#E3EEFF;color:#1B4D9B}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.kv:last-child{border:0}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.mono{font-family:var(--mono)}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li small{display:block;font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-block}
.c-ok{background:var(--lime-soft);color:var(--forest-deep)}
.c-warn{background:#FDF0CF;color:#7A5300}
.c-err{background:#FFE1DD;color:#9A2A1E}
.c-info{background:#E3EEFF;color:#1B4D9B}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;border:0;flex:none}
.toggle::after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:var(--white);top:2px;left:2px;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--lime)}
.toggle.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--white);border-radius:999px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
.seg button{flex:1;height:38px;border:0;background:none;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--forest);color:var(--lime)}
.msg{background:var(--forest);color:var(--white);border-radius:20px;padding:16px;font-size:15px;line-height:23px;margin-bottom:10px}
.audio{display:flex;gap:8px}
.audio button{flex:1;height:42px;border-radius:999px;border:0;background:var(--lime);color:var(--forest-deep);font-weight:700;font-size:14px}
.audio button.g{background:rgba(255,255,255,.12);color:var(--white)}
.dimmed{opacity:.45}
.pick{width:100%;background:var(--white);border:0;border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);text-align:left;display:flex;justify-content:space-between;align-items:center}
.pick b{font-size:14px;display:block}
.pick small{font-size:12px;color:var(--muted)}
.overlay{position:absolute;inset:0;background:rgba(6,35,26,.4);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--paper);border-radius:28px 28px 0 0;padding:22px 20px 28px;width:100%;max-height:82%;overflow:auto}
.sheet h3{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--forest-deep);margin-bottom:6px}
.sheet p{color:var(--muted);font-size:14px;margin-bottom:14px}
.toast{position:absolute;left:20px;right:20px;bottom:24px;background:var(--forest);color:var(--white);padding:12px 16px;border-radius:16px;font-size:14px;font-weight:600;text-align:center;z-index:40}
.phone.dark{background:#06231A;color:#F5F8F3}
.phone.dark .card,.phone.dark .group,.phone.dark .pick,.phone.dark .topbar button{background:#0B3322;color:#F5F8F3}
.phone.dark .topbar h1,.phone.dark .card b,.phone.dark .row .rt b,.phone.dark .sec{color:#F5F8F3}
.phone.dark .row{border-color:#1F5C3F}
.phone.dark .row .ri{background:#06231A}
.phone.dark .row .ri svg{stroke:#8BFA5A}
.phone.dark .input{background:#06231A;color:#F5F8F3;box-shadow:inset 0 0 0 1px #1F5C3F}
.phone.dark .sheet{background:#06231A}
.phone.dark .kv,.phone.dark .li{border-color:#1F5C3F}
.phone.dark .seg{background:#0B3322}
.phone.dark .seg button{color:rgba(255,255,255,.7)}
.phone.dark .seg button.on{background:#8BFA5A;color:#06231A}
.phone.dark .card p,.phone.dark .row .rt small,.phone.dark .li small{color:rgba(255,255,255,.65)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="demo-bar">
  <label for="scenario">Scénario de démonstration</label>
  <select id="scenario" onchange="setScenario(this.value)">
    <option value="normal">Abonnement actif (fin le 27/11/2026)</option>
    <option value="bande">Fin d'abonnement dans 2 jours</option>
    <option value="mouvement">Changement de gérant avec mouvements depuis l'inventaire</option>
  </select>
</div>

<div class="phone" id="phone">
  <div class="status"><span>9:41</span><span class="mono" style="font-size:12px">●●● 5G</span></div>
  <div class="topbar" id="topbar"></div>
  <div class="content" id="content"></div>
  <div id="overlay"></div>
  <div class="toast hide" id="toast"></div>
</div>

<script>
// ---------- Données ----------
const S={
  bar:{name:'Buvette Chez Mama Africa',rccm:'RB-COT-24-A-1234',lieu:'Cotonou',owner:'M. Adjovi',wa:'+229 01 90 00 00 01',gerant:'Rachelle'},
  sub:{end:'27/11/2026'},
  devices:[
    {id:'d1',who:'Rachelle',model:'Android · Chrome',last:'29/10 · 07:58',role:'Gérant'},
    {id:'d2',who:'M. Adjovi',model:'iPhone · Safari',last:'29/10 · maintenant',role:'Propriétaire'}
  ],
  annexes:[{name:'Buvette Centre',lieu:'Cotonou',gerant:'Rachelle'}],
  invs:[
    {id:'i1',d:'29/10/2026 · 14 h 10',who:'M. Adjovi',moves:false},
    {id:'i2',d:'21/10/2026 · 20 h 45',who:'Rachelle',moves:false}
  ],
  journal:[
    {when:'29/10 11 h 40',who:'Rachelle',act:'Correction de ravitaillement',det:'Heineken 33 cl : +6 bouteilles · erreur de saisie',type:'corr'},
    {when:'28/10 16 h 20',who:'Rachelle',act:'Changement de prix',det:'Castel 65 cl : 8 400 F → 8 600 F',type:'prix'},
    {when:'27/10 11 h 00',who:'Rachelle',act:'Casse déclarée',det:'Castel 65 cl : 1 bouteille, défaillante (gaz)',type:'casse'},
    {when:'21/10 20 h 45',who:'Rachelle',act:'Inventaire validé',det:'Stock compté, 1 manquant',type:'inv'},
    {when:'14/10 21 h 05',who:'M. Adjovi',act:'Lien gérant renvoyé',det:'Ancien appareil révoqué',type:'lien'}
  ]
};
let route='home', scn='normal', overlay=null, toastT, jFilter='', mode='clair', pin=false, showDemo=false, tmpGerant='';
const ICO={
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
  warn:'<path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9L2.5 17.5A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  ok:'<path d="M5 12l5 5L20 7"/>', back:'<path d="M15 5l-7 7 7 7"/>', chev:'<path d="M9 6l6 6-6 6"/>',
  bar:'<path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/>', user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  dev:'<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M11 18h2"/>', card:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>',
  store:'<path d="M4 9h16l-1 11H5z"/><path d="M4 9l2-5h12l2 5"/>', tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>',
  log:'<path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/>', shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  moon:'<path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10z"/>', help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4M12 17h.01"/>',
  pdf:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h6"/>', key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>'
};
const ico=(p,w=18)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hide'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hide'),2400); }
function go(r){ route=r; overlay=null; render(); }
function setScenario(v){ scn=v; S.invs[0].moves = v==='mouvement'; route='home'; render(); }
function openOv(html){ overlay=html; render(); }
function closeOv(){ overlay=null; render(); }

// ---------- Rendu ----------
const TITLES={home:'Profil',info:'Informations du bar',gerant:'Gérant',changeA:'Même gérant, nouvel appareil',changeB:'Changer de gérant',devices:'Appareils connectés',abo:'Abonnement',annexes:'Annexes',journal:'Journal d\'audit',security:'Sécurité',appearance:'Apparence',help:'Aide'};
function render(){
  const top=document.getElementById('topbar');
  top.innerHTML = route==='home'
    ? '<h1>Profil</h1>'
    : `<button onclick="go('home')" aria-label="Retour">${ico(ICO.back,20)}</button><h1 style="font-size:20px;line-height:26px">${TITLES[route]}</h1>`;
  const c=document.getElementById('content');
  const fn={home:homeView,info:infoView,gerant:gerantView,changeA:changeAView,changeB:changeBView,devices:devicesView,abo:aboView,annexes:annexesView,journal:journalView,security:securityView,appearance:appearanceView,help:helpView}[route];
  c.innerHTML = fn();
  document.getElementById('overlay').innerHTML = overlay? `<div class="overlay" onclick="if(event.target===this)closeOv()"><div class="sheet">${overlay}</div></div>`:'';
  document.getElementById('content').style.filter = overlay?'blur(0)':'';
}
function row(icon,title,sub,target){
  return `<button class="row" onclick="go('${target}')"><span class="ri">${ico(icon)}</span><span class="rt"><b>${title}</b><small>${sub}</small></span><span class="chev">${ico(ICO.chev,18)}</span></button>`;
}
function homeView(){
  const days=Math.ceil((new Date('2026-11-27')-new Date('2026-10-29'))/86400000);
  const band = scn==='bande' ? `<div class="notice n-warn">${ico(ICO.warn,18)}<span><b>Votre abonnement se termine le 31/10/2026.</b> Renouvelez avant la fin.</span></div>` : '';
  return `
    <div class="hero"><div class="av">MA</div><div><b>${S.owner}</b><small>${S.bar.name} · ${S.bar.lieu}</small></div></div>
    ${band}
    <div class="sec">Établissement</div>
    <div class="group">${row(ICO.bar,'Informations du bar',S.bar.name+' · RCCM',"info")}${row(ICO.user,'Gérant',`Gérant actuel : ${S.bar.gerant}`,'gerant')}${row(ICO.dev,'Appareils connectés',`${S.devices.length} appareils`,'devices')}</div>
    <div class="sec">Abonnement et annexes</div>
    <div class="group">${row(ICO.card,'Abonnement',`Fin le ${S.sub.end}`,'abo')}${row(ICO.store,'Annexes',`${S.annexes.length} annexe(s)`,'annexes')}${row(ICO.tag,'Produits et prix','Consultation, saisie par le gérant','stock')}</div>
    <div class="sec">Contrôle</div>
    <div class="group">${row(ICO.log,'Journal d\'audit','Historique en lecture seule','journal')}${row(ICO.shield,'Sécurité','PIN et sauvegarde','security')}${row(ICO.moon,'Apparence','Mode clair ou sombre','appearance')}${row(ICO.help,'Aide','Guide, contact et version','help')}</div>
  `;
}

// ---------- Informations du bar ----------
function infoView(){
  return `<div class="card"><div class="field"><label>Nom du bar</label><input class="input" value="${S.bar.name}" disabled></div>
    <div class="field"><label>RCCM</label><input class="input mono" id="rccm" value="${S.bar.rccm}"></div>
    <div class="field"><label>Lieu</label><input class="input" value="${S.bar.lieu}"></div>
    <div class="field"><label>Nom du propriétaire</label><input class="input" value="${S.owner}"></div>
    <div class="field"><label>Contact WhatsApp</label><input class="input mono" value="${S.bar.wa}" disabled><div class="hint">Seul BarPro peut le modifier.</div></div>
    <div class="field"><label>Nom du gérant</label><input class="input" value="${S.bar.gerant}"></div>
    <button class="btn btn-dark" onclick="saveInfo()">Enregistrer</button></div>`;
}
function saveInfo(){ S.bar.rccm=document.getElementById('rccm').value.trim()||S.bar.rccm; S.journal.unshift({when:'29/10 maintenant',who:'M. Adjovi',act:'Informations modifiées',det:'RCCM mis à jour',type:'info'}); toast('Informations enregistrées'); }

// ---------- Gérant ----------
function gerantView(){
  return `<div class="card"><b>${S.bar.gerant}</b><p>Gérant actuel · appareil : Android · Chrome, dernière activité 07:58</p></div>
    <div class="sec">Lien du gérant</div>
    <div class="group">
      ${row(ICO.key,'Renvoyer le lien','Message WhatsApp pré-écrit','gerant-link')}
    </div>
    <div class="sec">Changement</div>
    <div class="group">${row(ICO.dev,'Même gérant, nouvel appareil','Téléphone perdu ou changé','changeA')}${row(ICO.user,'Changer de gérant','Nouvelle personne à la vente','changeB')}</div>`;
}
function openGerantLink(){
  openOv(`<h3>Lien du gérant</h3><p>Envoyé au gérant par WhatsApp.</p>
    <div class="msg">Bonjour ${S.bar.gerant}, voici votre lien d'accès à BarPro pour ${S.bar.name} : https://barpro.app/g/K3PX-7MQ2. Il ne peut être utilisé qu'une fois.</div>
    <button class="btn btn-wa" onclick="toast('Ouverture de WhatsApp')">Envoyer sur WhatsApp</button>
    <button class="btn btn-ghost" onclick="closeOv()">Fermer</button>`);
}

// ---------- Cas A : même gérant, nouvel appareil ----------
function changeAView(){
  return `<div class="notice n-warn">${ico(ICO.warn,18)}<span>L'ancien appareil de ${S.bar.gerant} sera révoqué. Les ventes hors ligne non synchronisées risquent d'être perdues.</span></div>
    <div class="card"><b>Même gérant : ${S.bar.gerant}</b><p>Un nouveau lien est généré. Il est envoyé uniquement au numéro enregistré.</p></div>
    <button class="btn btn-dark" onclick="confirmA()">Confirmer et générer le lien</button>`;
}
function confirmA(){
  openOv(`<h3>Confirmer</h3><p>Ce changement est définitif. Vérifiez que ${S.bar.gerant} n'a pas de ventes en attente sur l'ancien appareil.</p>
    <button class="btn btn-danger" onclick="doA()">Révoquer l'ancien appareil</button>
    <button class="btn btn-ghost" onclick="closeOv()">Annuler</button>`);
}
function doA(){ S.devices=S.devices.filter(d=>d.role!=='Gérant'); S.journal.unshift({when:'29/10 maintenant',who:'M. Adjovi',act:'Appareil du gérant révoqué',det:'Nouveau lien généré',type:'lien'}); overlay=null; toast('Ancien appareil révoqué. Lien généré.'); go('gerant'); }

// ---------- Cas B : changer de gérant ----------
function changeBView(){
  if(!tmpGerant){
    return `<div class="card"><b>Nouveau gérant</b><p>Saisissez le nom de la personne qui prend la vente.</p>
      <div class="field" style="margin-top:12px"><label>Nom du nouveau gérant</label><input class="input" id="ng" placeholder="Ex. Fabrice"></div>
      <button class="btn btn-dark" onclick="setNew()">Continuer</button></div>`;
  }
  const hasInv = S.invs.some(i=>!i.moves);
  return `<div class="card"><b>Avant la prise de service de ${tmpGerant}</b>
      <p>Faites un inventaire à ${S.bar.gerant}.</p>
      <div class="audio" style="margin-top:12px"><button onclick="toast('Lecture du message')">Écouter</button><button class="g" onclick="toast('Pause')">Pause</button><button class="g" onclick="toast('Réécouter')">Réécouter</button></div>
    </div>
    <div class="sec">Étape 1 · Inventaire</div>
    <button class="btn btn-primary" onclick="toast('Inventaire sur mon téléphone : écran Inventaire')">Faire l'inventaire sur mon téléphone</button>
    <button class="btn btn-ghost" onclick="toast('Inventaire sur l\\'appareil de ${S.bar.gerant}')">Faire l'inventaire sur l'appareil de ${S.bar.gerant}</button>
    <div class="sec">Étape 2 · Inventaire déjà fait</div>
    ${S.invs.map(i=>`<button class="pick ${i.moves?'dimmed':''}" onclick="pickInv('${i.id}')"><span><b>${i.d}</b><small>${i.who}${i.moves?' · Des mouvements ont eu lieu depuis cet inventaire. Refaites un inventaire.':' · Sans mouvement depuis sa validation'}</small></span>${ico(ICO.chev,18)}</button>`).join('')}
    ${hasInv? '' : '<div class="notice n-info">Aucun inventaire récent utilisable.</div>'}`;
}
function setNew(){ const v=document.getElementById('ng').value.trim(); if(!v){ toast('Saisissez le nom du nouveau gérant'); return; } tmpGerant=v; render(); }
function pickInv(id){
  const i=S.invs.find(x=>x.id===id);
  if(i.moves){ toast('Des mouvements ont eu lieu depuis cet inventaire. Refaites un inventaire.'); return; }
  openOv(`<h3>Stock disponible</h3><p>Liste du stock compté le ${i.d}.</p>
    <button class="btn btn-dark" onclick="toast('PDF : stock_disponible_2026-10-29.pdf')">${ico(ICO.pdf,18)} Télécharger le stock en PDF</button>
    <button class="btn btn-primary" onclick="finishB()">Générer le lien de ${tmpGerant} et révoquer ${S.bar.gerant}</button>
    <button class="btn btn-ghost" onclick="closeOv()">Annuler</button>`);
}
function finishB(){
  const old=S.bar.gerant; S.bar.gerant=tmpGerant; S.devices=S.devices.filter(d=>d.role!=='Gérant');
  S.journal.unshift({when:'29/10 maintenant',who:'M. Adjovi',act:'Changement de gérant',det:`${old} → ${tmpGerant} · ancien appareil révoqué`,type:'gerant'});
  tmpGerant=''; overlay=null; toast(`Lien généré pour ${S.bar.gerant}. Ancien gérant révoqué.`); go('gerant');
}

// ---------- Appareils ----------
function devicesView(){
  return `<div class="group">${S.devices.map(d=>`<div class="row" style="cursor:default"><span class="ri">${ico(ICO.dev)}</span><span class="rt"><b>${d.who} · ${d.role}</b><small>${d.model} · ${d.last}</small></span>${d.role==='Gérant'?`<button class="btn btn-sm btn-danger" onclick="revoke('${d.id}')">Révoquer</button>`:'<span class="chip c-info">Ce téléphone</span>'}</div>`).join('')}</div>
    <div class="notice n-info">${ico(ICO.info,18)}<span>Révoquer un appareil déconnecte le gérant. Ses ventes non synchronisées sont à vérifier.</span></div>`;
}
function revoke(id){ S.devices=S.devices.filter(d=>d.id!==id); S.journal.unshift({when:'29/10 maintenant',who:'M. Adjovi',act:'Appareil révoqué',det:'Appareil du gérant',type:'lien'}); toast('Appareil révoqué'); render(); }

// ---------- Abonnement ----------
function aboView(){
  const band = scn==='bande' ? `<div class="notice n-warn">${ico(ICO.warn,18)}<span><b>Votre abonnement se termine le 31/10/2026.</b> Renouvelez avant la fin.</span></div>`:'';
  return `${band}<div class="card"><div class="kv" style="padding-top:0"><span>Date de fin</span><b class="mono">${scn==='bande'?'31/10/2026':S.sub.end}</b></div>
    <div class="field" style="margin-top:12px"><label>Code d'abonnement</label><input class="input mono" placeholder="XXXX-XXXX-XXXX"></div>
    <button class="btn btn-dark" onclick="toast('Code vérifié ! Abonnement prolongé.')">Valider le code</button></div>
    <button class="btn btn-wa" onclick="toast('Ouverture WhatsApp BarPro')">Renouveler sur WhatsApp</button>`;
}

// ---------- Annexes ----------
function annexesView(){
  return `<div class="group">${S.annexes.map(a=>`<div class="row" style="cursor:default"><span class="ri">${ico(ICO.store)}</span><span class="rt"><b>${a.name}</b><small>${a.lieu} · gérant : ${a.gerant}</small></span></div>`).join('')}</div>
    <button class="btn btn-dark" onclick="openOv(annexOv())">Ajouter une annexe</button>
    <div class="hint" style="margin-top:8px;text-align:center">Chaque annexe a son abonnement, son stock et son gérant. Sans essai gratuit.</div>`;
}
function annexOv(){
  return `<h3>Ajouter une annexe</h3><p>Veuillez contacter BarPro pour créer une annexe.</p>
    <div class="msg" style="font-size:14px">Bonjour BarPro, je souhaite ajouter une annexe à ${S.bar.name}.</div>
    <button class="btn btn-wa" onclick="toast('Ouverture WhatsApp BarPro')">Contacter BarPro</button>
    <div class="field" style="margin-top:14px"><label>Code reçu de BarPro</label><input class="input mono" id="ac" placeholder="XXXX-XXXX-XXXX"></div>
    <button class="btn btn-ghost" onclick="annexCode()">Valider le code</button>`;
}
function annexCode(){ const v=document.getElementById('ac').value.trim(); if(v.length<12){ toast('Code incomplet'); return; } overlay=null; toast('Annexe créée. Saisissez son nom et son lieu.'); render(); }

// ---------- Journal ----------
function journalView(){
  const typeLbl={corr:'Correction',prix:'Prix',casse:'Casse',inv:'Inventaire',lien:'Lien',info:'Info',gerant:'Gérant'};
  const list=S.journal.filter(j=>!jFilter || j.type===jFilter);
  return `<div class="notice n-info">${ico(ICO.info,18)}<span>Le journal est en lecture seule : il ne peut être ni modifié ni supprimé.</span></div>
    <div class="seg">${['','prix','casse','corr','inv','lien'].map(t=>`<button class="${jFilter===t?'on':''}" onclick="setJ('${t}')">${t?typeLbl[t]:'Tout'}</button>`).join('')}</div>
    <div class="card" style="padding:4px 16px">${list.map(j=>`<div class="li"><div><b style="font-size:14px">${j.act}</b><small>${j.det}</small><small>${j.when} · ${j.who}</small></div><span class="chip c-info">${typeLbl[j.type]||''}</span></div>`).join('')||'<div class="li"><span style="color:var(--muted)">Aucune action</span></div>'}</div>`;
}
function setJ(t){ jFilter=t; render(); }

// ---------- Sécurité, apparence, aide ----------
function securityView(){
  return `<div class="group"><div class="row" style="cursor:default"><span class="ri">${ico(ICO.shield)}</span><span class="rt"><b>Code PIN</b><small>Facultatif, désactivé par défaut</small></span><button class="toggle ${pin?'on':''}" onclick="togglePin()" aria-label="PIN"></button></div></div>
    <div class="sec">Sauvegarde</div>
    <div class="group"><button class="row" onclick="toast('Export PDF des données du bar')"><span class="ri">${ico(ICO.pdf)}</span><span class="rt"><b>Exporter en PDF</b><small>Données du bar</small></span></button><button class="row" onclick="toast('Export CSV des données du bar')"><span class="ri">${ico(ICO.log)}</span><span class="rt"><b>Exporter en CSV</b><small>Données du bar</small></span></button></div>`;
}
function togglePin(){ pin=!pin; toast(pin?'PIN activé':'PIN désactivé'); render(); }
function appearanceView(){
  return `<div class="seg"><button class="${mode==='clair'?'on':''}" onclick="setMode('clair')">Clair</button><button class="${mode==='sombre'?'on':''}" onclick="setMode('sombre')">Sombre</button></div>
    <div class="card"><b>Mode ${mode}</b><p>Appliqué à toute l'application propriétaire sur cet appareil.</p></div>`;
}
function setMode(m){ mode=m; document.getElementById('phone').classList.toggle('dark', m==='sombre'); toast('Apparence : '+m); render(); }
function helpView(){
  return `<div class="group"><button class="row" onclick="toast('Guide d\\'installation')"><span class="ri">${ico(ICO.info)}</span><span class="rt"><b>Guide d'installation</b><small>Android et iPhone</small></span></button><button class="row" onclick="toast('Ouverture WhatsApp BarPro')"><span class="ri">${ico(ICO.help)}</span><span class="rt"><b>Contacter BarPro</b><small>WhatsApp</small></span></button></div>
    <div class="card"><div class="kv"><span>Version de l'appli</span><b class="mono">1.0.0</b></div></div>`;
}

// Ouverture des actions depuis les pages (lien gérant)
const _go = go;
go = function(r){ if(r==='gerant-link'){ openGerantLink(); return; } if(r==='stock'){ toast('Produits et prix : fichier Stock'); return; } _go(r); };
render();
</script>
</body>
</html>
