<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3322">
<title>App Gérant — Statistiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--lime:#8BFA5A;--forest:#0B3322;--forest-deep:#06231A;--mid:#1F5C3F;--paper:#F5F8F3;--white:#fff;--ink:#0B1F16;--muted:#5E7266;--line:#DCE6DD;--shadow:0 1px 2px rgba(11,31,22,.06),0 8px 24px rgba(11,31,22,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:22px;color:var(--ink);background:#E9EEE9;min-height:100vh;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;cursor:pointer}
.demo-bar{max-width:390px;margin:0 auto;padding:16px 0 12px;display:flex;flex-direction:column;gap:8px}
.demo-bar label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.demo-bar select{height:40px;border-radius:999px;border:0;background:var(--white);box-shadow:var(--shadow);padding:0 16px;font-size:14px;outline:none}
.phone{width:390px;height:844px;max-width:100%;margin:0 auto;background:var(--paper);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(6,35,26,.25),0 0 0 10px #0B1F16;display:flex;flex-direction:column}
@media (max-width:440px){.phone{border-radius:0;box-shadow:none;height:100vh;height:100dvh}}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:600}
.top{padding:4px 18px 8px}
.top h1{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.03em;color:var(--forest-deep)}
.top p{font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--white);border-radius:999px;padding:4px;box-shadow:var(--shadow);margin:6px 18px 12px}
.seg button{flex:1;height:36px;border:0;background:none;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--forest);color:var(--lime)}
.scroll{flex:1;overflow-y:auto;padding:0 18px 28px}
.hero{background:var(--forest);color:var(--white);border-radius:24px;padding:18px;margin-bottom:12px}
.hero span{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}
.hero b{display:block;font-family:var(--mono);font-size:32px;line-height:38px;color:var(--lime);letter-spacing:-.02em;margin-top:4px}
.hero small{font-size:13px;color:rgba(255,255,255,.75)}
.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);font-weight:700;margin:16px 2px 8px}
.card{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:6px 16px;margin-bottom:12px}
.rk{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border:0}
.rk .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rk .t{font-size:14px;font-weight:600}
.rk .bar{height:6px;border-radius:999px;background:var(--paper);margin-top:6px;overflow:hidden}
.rk .bar div{height:100%;background:var(--lime);border-radius:999px}
.rk .v{font-family:var(--mono);font-size:14px;font-weight:600;text-align:right}
.tbl{width:100%;border-collapse:collapse;background:var(--white);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);font-size:13px}
.tbl th{text-align:right;font-size:11px;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line);letter-spacing:.03em}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono)}
.tbl td:first-child{font-family:var(--font,inherit);font-weight:600}
.tbl tr:last-child td{border:0}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:18px}
.toast{position:absolute;left:18px;right:18px;bottom:96px;background:var(--forest);color:var(--white);padding:12px 16px;border-radius:16px;font-size:14px;font-weight:600;text-align:center;z-index:30}
.body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.nav{flex:none;background:var(--white);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:8px 4px 22px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);min-height:48px;padding-top:2px;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--forest)}
.tab.on::before{content:"";position:absolute;top:-8px;width:28px;height:3px;border-radius:999px;background:var(--lime)}
.hide{display:none!important}
</style>
</head>
<body>

<div class="demo-bar">
  <label for="scenario">Scénario</label>
  <select id="scenario" onchange="setScenario(this.value)">
    <option value="month">Mois en cours (octobre 2026)</option>
    <option value="year">Année 2026</option>
  </select>
</div>

<div class="phone">
  <div class="status"><span>9:41</span><span class="mono" style="font-size:12px">●●● 5G</span></div>
  <div class="top"><h1>Statistiques</h1><p id="sub">Quantités vendues</p></div>
  <div class="seg" id="seg"></div>
  <div class="body">
    <div class="scroll" id="pane"></div>
    <div class="toast hide" id="toast"></div>
  </div>
  <nav class="nav" id="nav"></nav>
</div>

<script>
// Quantités uniquement : aucun chiffre d'affaires par boisson, aucun bénéfice, aucune marge, aucune casse en francs, aucun export PDF.
const BOT=[
 {n:'Coca-Cola 33 cl',m:960,tile:'#F9C9C0'},
 {n:'Castel 65 cl',m:620,tile:'#FCE7B0'},
 {n:'Fanta 33 cl',m:600,tile:'#FFD9A8'},
 {n:'Possotomè 50 cl',m:560,tile:'#D3E8F7'},
 {n:'Cristal 50 cl',m:520,tile:'#DDEEF9'},
 {n:'Beaufort 65 cl',m:480,tile:'#E8D3B5'},
 {n:'Sprite 33 cl',m:480,tile:'#D5F0C8'},
 {n:'Heineken 33 cl',m:410,tile:'#CDEBD0'},
 {n:'Cristal 1,5 L',m:360,tile:'#C8E2F4'},
 {n:'La Béninoise 65 cl',m:300,tile:'#F7D9C4'},
 {n:'Possotomè 1,5 L',m:240,tile:'#CFE6F5'},
 {n:'Top Ananas 33 cl',m:240,tile:'#FCEBB0'}
];
// Année : facteur à partir d'octobre (démonstration)
const YEAR_F=7.96;
// Journées de vente (4 h à 3 h 59), tickets annulés exclus : 2 tickets annulés ce mois-ci
const CANCELLED=2;
const SEG=[['month','Mois'],['year','Année']];
let period='month', tab=5, toastT;
const N=n=>Math.round(n).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ');

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hide'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hide'),2400); }
function setScenario(v){ period=v; render(); }
function setPeriod(p){ period=p; document.getElementById('scenario').value=p; render(); }
function list(){ return BOT.map(b=>({...b, v: period==='month'? b.m : Math.round(b.m*YEAR_F)})); }

function render(){
  document.getElementById('seg').innerHTML=SEG.map(([k,l])=>`<button class="${period===k?'on':''}" onclick="setPeriod('${k}')">${l}</button>`).join('');
  document.getElementById('sub').textContent = period==='month' ? 'Octobre 2026 · quantités vendues' : 'Année 2026 · quantités vendues';
  const data=list().sort((a,b)=>b.v-a.v);
  const total=data.reduce((a,b)=>a+b.v,0);
  const max=data[0].v;
  const ranking = data.slice(0,6).map((b,i)=>`<div class="rk"><span class="n">${i+1}</span><div><div class="t">${b.n}</div><div class="bar"><div style="width:${b.v/max*100}%"></div></div></div><div class="v">${N(b.v)} b.</div></div>`).join('');
  const detail = data.map(b=>`<tr><td>${b.n}</td><td>${N(b.v)}</td></tr>`).join('');
  document.getElementById('pane').innerHTML=`
    <div class="hero"><span>Bouteilles vendues</span><b>${N(total)}</b><small>${period==='month'?'Depuis le 1er octobre':'Depuis le 1er janvier'} · ${CANCELLED} tickets annulés exclus</small></div>
    <div class="sec">Les plus vendues</div>
    <div class="card">${ranking}</div>
    <div class="sec">Détail par boisson</div>
    <table class="tbl"><thead><tr><th>Boisson</th><th>Bouteilles</th></tr></thead><tbody>${detail}</tbody></table>
    <div class="note">Les statistiques sont calculées par journée commerciale (4 h à 3 h 59). Les tickets annulés sont exclus.</div>`;
  renderNav();
}
function renderNav(){
  const T=[['Vente','M6 3h12v18l-3-2-3 2-3-2-3 2z'],['Stock','M3 4h18v5H3zM5 9v10h14V9'],['Pénurie','M12 8v5M12 17h.01M10 3h4l8 17H2z'],['Ravitaill.','M3 7h13v10H3zM16 10h3l2 3v4h-5'],['Inventaire','M9 5h10M9 12h10M9 19h10'],['Stats','M4 20V10M10 20V4M16 20v-7M22 20H2']];
  document.getElementById('nav').innerHTML=T.map(([l,d],i)=>`<button class="tab ${i===5?'on':''}" onclick="toast('${l} : écran du fichier suivant')"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${l}</button>`).join('');
}
render();
</script>
</body>
</html>
