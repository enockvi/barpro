<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3322">
<title>BarPro — Splash screen</title>
<style>
  :root{
    --lime:#8BFA5A; --forest:#0B3322; --forest-deep:#06231A; --white:#FFFFFF;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:radial-gradient(120% 80% at 50% 35%, #0F4029 0%, var(--forest) 45%, var(--forest-deep) 100%);
    color:var(--white);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  }
  .screen{
    height:100%;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;padding:32px;
  }
  /* Halo lumineux derrière l'icône */
  .halo{
    position:absolute;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle, rgba(139,250,90,.22) 0%, rgba(139,250,90,0) 65%);
    top:50%;left:50%;transform:translate(-50%,-62%) scale(.6);opacity:0;
    animation:halo 1.4s cubic-bezier(.2,.8,.2,1) .1s forwards;
  }
  .mark{
    width:132px;height:132px;position:relative;
    opacity:0;transform:translateY(16px) scale(.86);
    animation:rise .9s cubic-bezier(.2,.8,.2,1) .15s forwards;
  }
  .wordmark{
    margin-top:32px;font-size:56px;line-height:56px;font-weight:800;letter-spacing:-.045em;
    display:flex;align-items:baseline;opacity:0;transform:translateY(12px);
    animation:rise .8s cubic-bezier(.2,.8,.2,1) .55s forwards;
  }
  .wordmark b{font-weight:800;color:var(--lime)}
  .sub{
    margin-top:14px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.42em;
    text-transform:uppercase;color:rgba(255,255,255,.7);opacity:0;
    animation:fade .8s ease .9s forwards;
  }
  /* Barre de progression */
  .loader{
    position:absolute;bottom:max(64px, calc(env(safe-area-inset-bottom,0px) + 48px));
    width:120px;height:3px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;
    opacity:0;animation:fade .6s ease 1.1s forwards;
  }
  .loader::after{
    content:"";display:block;height:100%;width:40%;border-radius:999px;background:var(--lime);
    animation:sweep 1.4s cubic-bezier(.45,0,.55,1) infinite;
  }
  .footer{
    position:absolute;bottom:max(24px, env(safe-area-inset-bottom,0px));
    font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.45);opacity:0;
    animation:fade .8s ease 1.3s forwards;
  }
  /* Sortie douce vers l'écran d'accueil */
  .screen.exit{animation:out .5s ease forwards}

  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}
  @keyframes halo{to{opacity:1;transform:translate(-50%,-62%) scale(1)}}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  @keyframes out{to{opacity:0;transform:scale(1.02)}}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01s!important;animation-delay:0s!important}
  }
</style>
</head>
<body>
<main class="screen" id="screen">
  <div class="halo"></div>

  <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
    <rect width="200" height="200" rx="46" fill="#8BFA5A"/>
    <path fill="#0B3322" d="M64 23 H88.5 V60 C88.5 66 106.6 74 106.6 92 V157 Q106.6 169 94.6 169 H58 Q46 169 46 157 V92 C46 74 64 66 64 60 Z"/>
    <path fill="#8BFA5A" stroke="#8BFA5A" stroke-width="7" stroke-linejoin="round" d="M84 92 H160 L152.6 160 Q151.6 169 142 169 H104 Q94.5 169 95.5 160 Z"/>
    <path fill="#0B3322" d="M84 92 H160 L152.6 160 Q151.6 169 142 169 H104 Q94.5 169 95.5 160 Z"/>
  </svg>

  <div class="wordmark" aria-label="BarPro">Bar<b>Pro</b></div>
  <div class="sub">By NCK</div>

  <div class="loader" aria-hidden="true"></div>
  <div class="footer">Version 1.0</div>
</main>

<script>
  // Transition vers l'écran suivant après la séquence d'intro.
  // Remplacez l'URL par votre écran d'accueil (ex. "home.html").
  const NEXT_SCREEN = null;
  setTimeout(() => {
    const screen = document.getElementById('screen');
    screen.classList.add('exit');
    setTimeout(() => {
      if (NEXT_SCREEN) window.location.href = NEXT_SCREEN;
    }, 500);
  }, 3000);
</script>
</body>
</html>
