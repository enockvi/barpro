<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3322">
<title>App Gérant — Stock et fiches produit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--lime:#8BFA5A;--forest:#0B3322;--forest-deep:#06231A;--mid:#1F5C3F;--paper:#F5F8F3;--white:#fff;--ink:#0B1F16;--muted:#5E7266;--line:#DCE6DD;--amber:#F5B841;--coral:#FF6B5B;--lime-soft:#D9FBC8;
--font:"Inter",-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--shadow:0 1px 2px rgba(11,31,22,.06),0 8px 24px rgba(11,31,22,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:15px;line-height:22px;color:var(--ink);background:#E9EEE9;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;cursor:pointer}
input{cursor:text}
.hide{display:none!important}
.demo-bar{max-width:390px;margin:0 auto;padding:16px 0 12px;display:flex;flex-direction:column;gap:8px}
.demo-bar label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.demo-bar select{height:40px;border-radius:999px;border:0;background:var(--white);box-shadow:var(--shadow);padding:0 16px;font-size:14px;outline:none}
.phone{width:390px;height:844px;max-width:100%;margin:0 auto;background:var(--paper);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(6,35,26,.25),0 0 0 10px #0B1F16;display:flex;flex-direction:column}
@media (max-width:440px){.phone{border-radius:0;box-shadow:none;height:100vh;height:100dvh}}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:600}
.top{padding:4px 18px 8px}
.top h1{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.03em;color:var(--forest-deep)}
.subtabs{display:flex;background:var(--white);border-radius:999px;padding:4px;box-shadow:var(--shadow);margin:6px 18px 10px}
.subtabs button{flex:1;height:36px;border:0;background:none;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);position:relative}
.subtabs button.on{background:var(--forest);color:var(--lime)}
.subtabs .n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:999px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;margin-left:4px;padding:0 5px}
.period{display:flex;gap:8px;padding:0 18px 10px;overflow-x:auto}
.period button{flex:none;height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--white);box-shadow:var(--shadow);font-size:12px;font-weight:600;color:var(--muted)}
.period button.on{background:var(--forest);color:var(--lime)}
.list{flex:1;overflow-y:auto;padding:0 18px 28px}
.band{width:100%;background:var(--white);border:0;border-radius:20px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;text-align:left}
.photo{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center}
.photo svg{width:24px;height:24px;stroke:var(--forest-deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.band .info{flex:1;min-width:0}
.band .name{font-weight:700;font-size:14px;display:block}
.band .meta{font-size:12px;color:var(--muted);display:block}
.band .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;font-size:11px;color:var(--muted)}
.band .nums b{display:block;font-family:var(--mono);font-size:12px;color:var(--ink)}
.reste{text-align:right;flex:none}
.reste b{display:block;font-family:var(--mono);font-size:12px;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:5px;white-space:nowrap}
.st svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-ok{background:var(--lime-soft);color:var(--forest-deep)}
.s-low{background:#FDF0CF;color:#7A5300}
.s-out{background:#FFE1DD;color:#9A2A1E}
.banner{border-radius:18px;padding:12px 14px;font-size:13px;line-height:19px;margin:0 18px 12px;background:#FDF0CF;color:#7A5300}
.note{font-size:12px;color:var(--muted);padding:0 18px 8px}
.sheet{position:absolute;inset:44px 0 0 0;background:var(--paper);display:flex;flex-direction:column;z-index:10}
.sheet-top{display:flex;align-items:center;gap:12px;padding:12px 18px}
.sheet-top button.back{width:40px;height:40px;border-radius:50%;border:0;background:var(--white);box-shadow:var(--shadow);font-size:18px;flex:none}
.sheet-top h2{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--forest-deep);flex:1}
.sheet-body{flex:1;overflow-y:auto;padding:0 18px 28px}
.card{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.kv:last-child{border:0}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);text-align:right}
.li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border:0}
.li small{display:block;font-size:12px;color:var(--muted)}
.li b{font-family:var(--mono);white-space:nowrap}
.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);font-weight:700;margin:14px 2px 8px}
.big{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:999px;border:0;font-weight:700;font-size:15px;margin-top:10px}
.btn-lime{background:var(--lime);color:var(--forest-deep)}
.btn-forest{background:var(--forest);color:var(--white)}
.btn-ghost{background:transparent;color:var(--forest-deep);box-shadow:inset 0 0 0 1.5px var(--forest-deep)}
.btn-wa{background:#25D366;color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--forest-deep)}
.input{width:100%;height:48px;border-radius:14px;border:0;background:var(--white);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;font-size:16px;outline:none}
.input:focus{box-shadow:inset 0 0 0 2px var(--mid),0 0 0 4px rgba(139,250,90,.35)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;border:0;flex:none}
.toggle::after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:var(--white);top:2px;left:2px;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--lime)}
.toggle.on::after{transform:translateX(20px)}
.photoPick{display:flex;gap:12px;align-items:center}
.photoPick .photo{width:72px;height:72px}
.photoPick label{display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:999px;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--forest-deep);font-weight:600;font-size:13px;cursor:pointer}
.photoPick input{display:none}
.conf{position:absolute;inset:0;background:rgba(6,35,26,.45);display:flex;align-items:flex-end;z-index:30}
.confcard{background:var(--paper);border-radius:28px 28px 0 0;padding:22px 20px 28px;width:100%}
.confcard h3{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--forest-deep);margin-bottom:6px}
.confcard p{color:var(--muted);font-size:14px;margin-bottom:10px}
.toast{position:absolute;left:18px;right:18px;bottom:96px;background:var(--forest);color:var(--white);padding:12px 16px;border-radius:16px;font-size:14px;font-weight:600;text-align:center;z-index:40}
.nav{flex:none;background:var(--white);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:8px 4px 22px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);min-height:48px;padding-top:2px;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--forest)}
.tab.on::before{content:"";position:absolute;top:-8px;width:28px;height:3px;border-radius:999px;background:var(--lime)}
.body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
</style>
</head>
<body>

<div class="demo-bar">
  <label for="scenario">Scénario</label>
  <select id="scenario" onchange="setScenario(this.value)">
    <option value="normal">Stock normal</option>
    <option value="inv">Inventaire en cours (quantités masquées)</option>
  </select>
</div>

<div class="phone" id="phone">
  <div class="status"><span>9:41</span><span class="mono" style="font-size:12px">●●● 5G</span></div>
  <div class="top"><h1 id="title">Stock</h1></div>
  <div class="subtabs" id="subtabs"></div>
  <div class="body">
    <div id="pane" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
    <div class="sheet hide" id="sheet"></div>
    <div class="conf hide" id="conf"></div>
    <div class="toast hide" id="toast"></div>
  </div>
  <nav class="nav" id="nav"></nav>
</div>

<script>
// ---------- Produits : prix d'achat et prix de vente ----------
let P=[
 {id:'castel',name:'Castel 65 cl',cat:'Bières',fmt:'65 cl',bpc:12,buyC:8400,price:800,promo:null,seuil:1,active:true,tile:'#FCE7B0',stock:32,ach:36,vendu:31,casse:2,inv:'21/10 · 2 casiers + 5 b.',casseMotifs:[{d:'24/10 14 h',q:1,m:'Cassée'},{d:'27/10 11 h',q:1,m:'Défaillante (gaz)'}],ravit:[['29/10 08 h 15','Rachelle','2 casiers']]},
 {id:'beaufort',name:'Beaufort 65 cl',cat:'Bières',fmt:'65 cl',bpc:12,buyC:8100,price:800,promo:null,seuil:1,active:true,tile:'#E8D3B5',stock:0,ach:12,vendu:24,casse:0,inv:'21/10 · 1 casier',casseMotifs:[],ravit:[]},
 {id:'benin',name:'La Béninoise 65 cl',cat:'Bières',fmt:'65 cl',bpc:12,buyC:7800,price:700,promo:null,seuil:1,active:true,tile:'#F7D9C4',stock:9,ach:12,vendu:15,casse:0,inv:'21/10 · 1 casier',casseMotifs:[],ravit:[]},
 {id:'heineken',name:'Heineken 33 cl',cat:'Bières',fmt:'33 cl',bpc:24,buyC:14400,price:800,promo:null,seuil:1,active:true,tile:'#CDEBD0',stock:28,ach:24,vendu:20,casse:0,inv:'21/10 · 1 casier',casseMotifs:[],ravit:[['29/10 11 h 40','Rachelle','+6 bouteilles (correction)']]},
 {id:'coca',name:'Coca-Cola 33 cl',cat:'Sucreries',fmt:'33 cl',bpc:24,buyC:5760,price:400,promo:{n:3,p:1000},seuil:1,active:true,tile:'#F9C9C0',stock:74,ach:48,vendu:48,casse:0,inv:'21/10 · 3 casiers + 2 b.',casseMotifs:[],ravit:[]},
 {id:'fanta',name:'Fanta 33 cl',cat:'Sucreries',fmt:'33 cl',bpc:24,buyC:5760,price:400,promo:{n:3,p:1000},seuil:1,active:true,tile:'#FFD9A8',stock:18,ach:24,vendu:30,casse:0,inv:'21/10 · 1 casier',casseMotifs:[],ravit:[['29/10 08 h 20','Rachelle','3 casiers']]},
 {id:'sprite',name:'Sprite 33 cl',cat:'Sucreries',fmt:'33 cl',bpc:24,buyC:5760,price:400,promo:null,seuil:1,active:true,tile:'#D5F0C8',stock:48,ach:24,vendu:24,casse:0,inv:'21/10 · 2 casiers',casseMotifs:[],ravit:[]},
 {id:'ananas',name:'Top Ananas 33 cl',cat:'Sucreries',fmt:'33 cl',bpc:24,buyC:5520,price:400,promo:null,seuil:1,active:true,tile:'#FCEBB0',stock:30,ach:0,vendu:6,casse:0,inv:'21/10 · 1 casier + 12 b.',casseMotifs:[],ravit:[]},
 {id:'pos50',name:'Possotomè 50 cl',cat:'Eau minérale',fmt:'50 cl',bpc:12,buyC:2400,price:300,promo:null,seuil:1,active:true,tile:'#D3E8F7',stock:36,ach:24,vendu:24,casse:0,inv:'21/10 · 3 casiers',casseMotifs:[],ravit:[]},
 {id:'pos15',name:'Possotomè 1,5 L',cat:'Eau minérale',fmt:'1,5 L',bpc:6,buyC:1800,price:500,promo:null,seuil:1,active:true,tile:'#CFE6F5',stock:9,ach:12,vendu:12,casse:0,inv:'21/10 · 1 casier + 3 b.',casseMotifs:[],ravit:[]},
 {id:'cris50',name:'Cristal 50 cl',cat:'Eau minérale',fmt:'50 cl',bpc:12,buyC:2400,price:300,promo:null,seuil:1,active:true,tile:'#DDEEF9',stock:24,ach:24,vendu:24,casse:0,inv:'21/10 · 2 casiers',casseMotifs:[],ravit:[]},
 {id:'cris15',name:'Cristal 1,5 L',cat:'Eau minérale',fmt:'1,5 L',bpc:6,buyC:1800,price:500,promo:null,seuil:1,active:true,tile:'#C8E2F4',stock:12,ach:18,vendu:18,casse:0,inv:'21/10 · 2 casiers',casseMotifs:[],ravit:[]},
 {id:'bissap',name:'Jus Bissap 50 cl',cat:'Sucreries',fmt:'50 cl',bpc:12,buyC:0,price:null,promo:null,seuil:1,active:true,tile:'#F2C6D8',stock:12,ach:0,vendu:0,casse:0,inv:'21/10 · 1 casier',casseMotifs:[],ravit:[]}
];
const CATALOGUE=[{name:'Youki 33 cl',cat:'Sucreries',fmt:'33 cl',bpc:24},{name:'Malta Guinness 33 cl',cat:'Bières',fmt:'33 cl',bpc:24},{name:'Eau Possotomè 75 cl',cat:'Eau minérale',fmt:'75 cl',bpc:12}];
const ICO={box:'<path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>', ok:'<path d="M5 12l5 5L20 7"/>', low:'<path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9L2.5 17.5A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>', out:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>', back:'<path d="M15 5l-7 7 7 7"/>'};
const ico=(p,w=14)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const F=n=>Math.round(n).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ')+' F';
const casRes=p=>{ const c=Math.floor(p.stock/p.bpc), b=p.stock%p.bpc; return `${c} casier${c>1?'s':''} + ${b} b.`; };
const level=p=> p.stock===0?'out': p.stock<p.bpc?'low':'ok';
const SUB=[{id:'stock',label:'Stock'},{id:'pen',label:'Pénurie'},{id:'prod',label:'Produits'}];
let sub='stock', period='inv', sc='normal', openId=null, editing=null;
const TITLES={stock:'Stock',pen:'Pénurie',prod:'Produits'};

function setScenario(v){ sc=v; render(); }
function setSub(s){ sub=s; closeSheet(); render(); }
function setPeriod(p){ period=p; render(); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hide'); clearTimeout(window.__t); window.__t=setTimeout(()=>t.classList.add('hide'),2600); }

function stBadge(p){
  const l=level(p);
  if(l==='out') return `<span class="st s-out">${ico(ICO.out)}Épuisé</span>`;
  if(l==='low') return `<span class="st s-low">${ico(ICO.low)}Plus que ${p.stock} b.</span>`;
  return `<span class="st s-ok">${ico(ICO.ok)}En stock</span>`;
}
function renderSubtabs(){
  const pen=P.filter(p=>p.active && p.price!=null && level(p)!=='ok').length;
  document.getElementById('subtabs').innerHTML=SUB.map(s=>`<button class="${sub===s.id?'on':''}" onclick="setSub('${s.id}')">${s.label}${s.id==='pen'&&pen?`<span class="n">${pen}</span>`:''}</button>`).join('');
}
function renderNav(){
  const T=[['Vente','M6 3h12v18l-3-2-3 2-3-2-3 2z'],['Stock','M3 4h18v5H3zM5 9v10h14V9'],['Pénurie','M12 8v5M12 17h.01M10 3h4l8 17H2z'],['Ravitaill.','M3 7h13v10H3zM16 10h3l2 3v4h-5'],['Inventaire','M9 5h10M9 12h10M9 19h10'],['Stats','M4 20V10M10 20V4M16 20v-7M22 20H2']];
  document.getElementById('nav').innerHTML=T.map(([l,d],i)=>`<button class="tab ${i===1?'on':''}" onclick="toast('${l} : écran du fichier suivant')"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${l}</button>`).join('');
}
function render(){
  renderSubtabs(); renderNav();
  document.getElementById('title').textContent=TITLES[sub];
  const pane=document.getElementById('pane');
  if(sub==='stock') pane.innerHTML=stockView();
  if(sub==='pen') pane.innerHTML=penView();
  if(sub==='prod') pane.innerHTML=prodView();
}

// ---------- Stock ----------
function stockView(){
  const hidden = sc==='inv';
  const per=[['inv','Depuis le dernier inventaire'],['mois','Mois en cours'],['libre','Période libre']];
  const banner = hidden ? `<div class="banner">Inventaire en cours. Les quantités sont masquées jusqu'à la fin du comptage.</div>` : '';
  const bands = P.filter(p=>p.price!=null || p.active).map(p=>`<button class="band" onclick="openSheet('${p.id}')">
     <span class="photo" style="background:${p.tile}">${ico(ICO.box,24)}</span>
     <span class="info"><span class="name">${p.name}</span><span class="meta">${p.cat} · ${p.fmt}</span>
       <span class="nums"><span>Acheté<b>${hidden?'—':p.ach}</b></span><span>Vendu<b>${hidden?'—':p.vendu}</b></span><span>Cassé<b>${hidden?'—':p.casse}</b></span></span></span>
     <span class="reste">${hidden? stBadge(p) : `<b>${casRes(p)}</b>${stBadge(p)}`}</span></button>`).join('');
  return `<div class="period">${per.map(([k,l])=>`<button class="${period===k?'on':''}" onclick="setPeriod('${k}')">${l}</button>`).join('')}</div>
    ${banner}<div class="list" style="padding-top:0">${bands}</div>`;
}

// ---------- Pénurie ----------
function penView(){
  const list=P.filter(p=>p.price!=null && p.active && level(p)!=='ok').sort((a,b)=>(a.stock===0?-1:0)-(b.stock===0?-1:0) || a.stock-b.stock);
  if(!list.length) return `<div class="list"><div style="text-align:center;color:var(--muted);padding:32px">Aucun produit en pénurie.</div></div>`;
  const msg = encodeURIComponent('Liste de pénurie : '+list.map(p=>`${p.name} (${p.stock===0?'épuisé':p.stock+' b.'})`).join(', '));
  return `<div class="note">Épuisés d'abord, puis du plus bas au plus haut.</div>
    <div class="list" style="padding-top:0">${list.map(p=>`<div class="card" style="display:flex;gap:12px;align-items:center">
      <span class="photo" style="background:${p.tile};width:44px;height:44px;border-radius:14px">${ico(ICO.box,20)}</span>
      <div style="flex:1"><b style="font-size:14px">${p.name}</b><div style="font-size:12px;color:var(--muted)">${casRes(p)}</div>${stBadge(p)}</div>
      <button class="btn btn-lime" style="width:auto;min-height:40px;margin:0;padding:0 14px;font-size:13px" onclick="toast('Ravitaillement : ${p.name} (écran suivant)')">Ravitailler</button></div>`).join('')}
      <button class="btn btn-wa" onclick="toast('Partage WhatsApp : ${msg.length} caractères')">Partager la liste de pénurie</button></div>`;
}

// ---------- Produits : liste et fiches modifiables ----------
function prodView(){
  return `<div class="note">Vous modifiez ici les fiches et les prix. Chaque changement de prix est signalé au propriétaire.</div>
    <div class="list" style="padding-top:0">${P.map(p=>`<button class="band" onclick="openSheet('${p.id}')">
      <span class="photo" style="background:${p.tile}">${ico(ICO.box,24)}</span>
      <span class="info"><span class="name">${p.name}</span><span class="meta">${p.bpc} bouteilles par casier · ${p.active?'actif':'inactif'}</span></span>
      <span class="reste"><b>${p.price==null?'Prix à renseigner':F(p.price)}</b></span></button>`).join('')}
      <button class="btn btn-forest" onclick="openNew()">Ajouter une boisson</button></div>`;
}

// ---------- Fiche détail ----------
function openSheet(id){ openId=id; editing=null; renderSheet(); }
function closeSheet(){ openId=null; editing=null; document.getElementById('sheet').classList.add('hide'); render(); }
function renderSheet(){
  const p=P.find(x=>x.id===openId); if(!p) return;
  const sh=document.getElementById('sheet'); sh.classList.remove('hide');
  const buyAvg = p.buyC ? Math.round(p.buyC/p.bpc) : null;
  const motifs = p.casseMotifs.length ? p.casseMotifs.map(m=>`<div class="li"><div>${m.m}<small>${m.d}</small></div><b>${m.q} b.</b></div>`).join('') : `<div class="li"><span style="color:var(--muted)">Aucune casse depuis le dernier inventaire</span></div>`;
  const ravit = p.ravit.length ? p.ravit.map(r=>`<div class="li"><div>${r[0]}<small>${r[1]}</small></div><b>${r[2]}</b></div>`).join('') : `<div class="li"><span style="color:var(--muted)">Aucun ravitaillement aujourd'hui</span></div>`;
  const promo = p.promo ? `${p.promo.n} pour ${F(p.promo.p)}` : 'Aucune';
  sh.innerHTML=`
    <div class="sheet-top"><button class="back" onclick="closeSheet()" aria-label="Retour">${ico(ICO.back,18)}</button><h2>${p.name}</h2></div>
    <div class="sheet-body">
      <div class="card" style="display:flex;gap:14px;align-items:center"><span class="photo" style="background:${p.tile};width:64px;height:64px">${ico(ICO.box,30)}</span>
        <div><b style="font-size:16px">${p.name}</b><div style="font-size:13px;color:var(--muted)">${p.cat} · ${p.fmt}</div>${stBadge(p)}</div></div>
      <div class="sec">Reste actuel</div>
      <div class="card"><div class="big">${casRes(p)}</div><div style="font-size:13px;color:var(--muted);margin-top:4px">${p.stock} bouteilles · seuil : 1 casier</div></div>
      <div class="sec">Sur la période</div>
      <div class="card">
        <div class="kv"><span>Acheté</span><b>${p.ach} b.</b></div>
        <div class="kv"><span>Vendu</span><b>${p.vendu} b.</b></div>
        <div class="kv"><span>Cassé / défaillant</span><b>${p.casse} b.</b></div>
      </div>
      <div class="sec">Ravitaillements</div><div class="card" style="padding:4px 14px">${ravit}</div>
      <div class="sec">Casse</div><div class="card" style="padding:4px 14px">${motifs}</div>
      <div class="sec">Dernier inventaire</div><div class="card"><div class="kv"><span>Quantité comptée</span><b>${p.inv}</b></div></div>
      <div class="sec">Prix</div>
      <div class="card">
        <div class="kv"><span>Prix d'achat moyen</span><b>${buyAvg==null?'—':F(buyAvg)}</b></div>
        <div class="kv"><span>Prix de vente</span><b>${p.price==null?'À renseigner':F(p.price)}</b></div>
        <div class="kv"><span>Promo</span><b>${promo}</b></div>
      </div>
      <button class="btn btn-forest" onclick="openEdit('${p.id}')">Modifier la fiche</button>
    </div>`;
}

// ---------- Fiche produit modifiable ----------
function openEdit(id){ editing=id; const p=P.find(x=>x.id===id); const sh=document.getElementById('sheet');
  sh.innerHTML=`
    <div class="sheet-top"><button class="back" onclick="renderSheet()" aria-label="Retour">${ico(ICO.back,18)}</button><h2>Modifier ${p.name}</h2></div>
    <div class="sheet-body">${formHtml(p)}</div>`;
}
function openNew(){ editing='new'; const sh=document.getElementById('sheet'); sh.classList.remove('hide');
  sh.innerHTML=`<div class="sheet-top"><button class="back" onclick="closeSheet()" aria-label="Retour">${ico(ICO.back,18)}</button><h2>Nouvelle boisson</h2></div>
    <div class="sheet-body">
      <div class="sec">Depuis le catalogue</div>
      ${CATALOGUE.map((c,i)=>`<button class="band" onclick="fromCat(${i})"><span class="info"><span class="name">${c.name}</span><span class="meta">${c.cat} · ${c.fmt} · ${c.bpc} b. par casier</span></span></button>`).join('')}
      <div class="sec">Ou créer</div>
      ${formHtml({name:'',cat:'Bières',fmt:'',bpc:'',buyC:'',price:'',promo:null,seuil:1,active:true,tile:'#E3EEFF'})}
    </div>`;
}
function fromCat(i){ const c=CATALOGUE[i]; editing='new'; const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="sheet-top"><button class="back" onclick="closeSheet()" aria-label="Retour">${ico(ICO.back,18)}</button><h2>${c.name}</h2></div>
    <div class="sheet-body">${formHtml({name:c.name,cat:c.cat,fmt:c.fmt,bpc:c.bpc,buyC:'',price:'',promo:null,seuil:1,active:true,tile:'#E3EEFF'})}</div>`; }
function formHtml(p){
  const isNew = editing==='new';
  return `<div class="card">
    <div class="field"><label>Photo</label><div class="photoPick"><span class="photo" style="background:${p.tile}">${ico(ICO.box,30)}</span><label>Choisir une photo<input type="file" accept="image/*" onchange="toast('Photo compressée et ajoutée')"></label></div></div>
    <div class="field"><label>Nom</label><input class="input" id="f-name" value="${p.name}"></div>
    <div class="row2">
      <div class="field"><label>Catégorie</label><select class="input" id="f-cat">${['Bières','Sucreries','Eau minérale'].map(c=>`<option ${c===p.cat?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Format</label><input class="input" id="f-fmt" value="${p.fmt}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Bouteilles par casier</label><input class="input" id="f-bpc" type="number" inputmode="numeric" value="${p.bpc}"></div>
      <div class="field"><label>Seuil d'alerte</label><input class="input" id="f-seuil" type="number" value="${p.seuil??1}"><div class="hint">1 casier par défaut</div></div>
    </div>
    <div class="row2">
      <div class="field"><label>Prix d'achat par casier</label><input class="input" id="f-buy" type="number" inputmode="numeric" value="${p.buyC||''}"></div>
      <div class="field"><label>Prix de vente, bouteille</label><input class="input" id="f-price" type="number" inputmode="numeric" value="${p.price??''}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Promo : nombre</label><input class="input" id="f-pn" type="number" value="${p.promo?p.promo.n:''}" placeholder="Facultatif"></div>
      <div class="field"><label>Promo : prix (F)</label><input class="input" id="f-pp" type="number" value="${p.promo?p.promo.p:''}" placeholder="Facultatif"></div>
    </div>
    <div class="field" style="display:flex;justify-content:space-between;align-items:center"><div><label style="margin:0">Produit actif</label><div class="hint">Un produit inactif disparaît du Vente, mais garde son historique.</div></div>
      <button class="toggle ${p.active?'on':''}" id="f-act" onclick="this.classList.toggle('on')" aria-label="Actif"></button></div>
  </div>
  <button class="btn btn-lime" onclick="saveProd()">Enregistrer</button>
  <button class="btn btn-ghost" onclick="${isNew?'closeSheet()':'renderSheet()'}">Annuler</button>`;
}
function saveProd(){
  const v=id=>document.getElementById(id).value.trim();
  const bpc=+v('f-bpc'), buyC=+v('f-buy'), price=v('f-price')===''?null:+v('f-price');
  const pn=+v('f-pn'), pp=+v('f-pp');
  if(!v('f-name')){ toast('Le nom est obligatoire'); return; }
  if(!bpc || bpc<1){ toast('Bouteilles par casier : obligatoire'); return; }
  const promo = pn>0 && pp>0 ? {n:pn,p:pp} : null;
  const active=document.getElementById('f-act').classList.contains('on');
  if(editing==='new'){
    P.push({id:'p'+(P.length+1),name:v('f-name'),cat:v('f-cat'),fmt:v('f-fmt'),bpc,buyC,price,promo,seuil:+v('f-seuil')||1,active,tile:'#E3EEFF',stock:0,ach:0,vendu:0,casse:0,inv:'—',casseMotifs:[],ravit:[]});
    toast('Boisson ajoutée à la fiche');
    closeSheet(); return;
  }
  const p=P.find(x=>x.id===editing);
  const oldPrice=p.price;
  Object.assign(p,{name:v('f-name'),cat:v('f-cat'),fmt:v('f-fmt'),bpc,buyC,price,promo,seuil:+v('f-seuil')||1,active});
  if(oldPrice!==price && price!=null){
    confirmPrice(p, oldPrice, price);
  } else { toast('Fiche enregistrée'); renderSheet(); render(); }
}
function confirmPrice(p, oldP, newP){
  const c=document.getElementById('conf');
  c.innerHTML=`<div class="confcard"><h3>Changer le prix ?</h3>
    <p>${p.name} : ${oldP==null?'pas de prix':F(oldP)} → <b>${F(newP)}</b>. Le propriétaire sera informé de ce changement.</p>
    <button class="btn btn-lime" onclick="document.getElementById('conf').classList.add('hide');toast('Prix enregistré. Propriétaire informé.');renderSheet();render();">Confirmer le changement</button>
    <button class="btn btn-ghost" onclick="p.price=${oldP==null?'null':oldP};document.getElementById('conf').classList.add('hide');renderSheet();">Annuler</button></div>`;
  c.classList.remove('hide');
}

render();
</script>
</body>
</html>
