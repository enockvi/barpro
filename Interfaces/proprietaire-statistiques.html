<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3322">
<title>App Propriétaire — Statistiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--lime:#8BFA5A;--forest:#0B3322;--forest-deep:#06231A;--mid:#1F5C3F;--paper:#F5F8F3;--white:#fff;--ink:#0B1F16;--muted:#5E7266;--line:#DCE6DD;--amber:#F5B841;--coral:#FF6B5B;--lime-soft:#D9FBC8;
--font:"Inter",-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--shadow:0 1px 2px rgba(11,31,22,.06),0 8px 24px rgba(11,31,22,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:15px;line-height:22px;color:var(--ink);background:#E9EEE9;min-height:100vh;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;cursor:pointer}
.demo-bar{max-width:390px;margin:0 auto;padding:16px 0 12px;display:flex;flex-direction:column;gap:8px}
.demo-bar label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.demo-bar select{height:40px;border-radius:999px;border:0;background:var(--white);box-shadow:var(--shadow);padding:0 16px;font-size:14px;outline:none}
.phone{width:390px;height:844px;max-width:100%;margin:0 auto;background:var(--paper);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(6,35,26,.25),0 0 0 10px #0B1F16;display:flex;flex-direction:column}
@media (max-width:440px){.phone{border-radius:0;box-shadow:none;height:100vh;height:100dvh}}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:600}
.head{padding:4px 20px 0}
.head h1{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.03em;color:var(--forest-deep)}
.head p{color:var(--muted);font-size:13px;margin-top:2px}
.controls{padding:14px 20px 0;display:flex;flex-direction:column;gap:10px}
.picker{height:40px;border-radius:999px;border:0;background:var(--white);box-shadow:var(--shadow);padding:0 16px;font-size:14px;font-weight:600;outline:none;width:100%}
.seg{display:flex;background:var(--white);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{flex:1;height:36px;border:0;background:none;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--forest);color:var(--lime)}
.content{flex:1;overflow-y:auto;padding:14px 20px 28px}
.kpi{background:var(--forest);color:var(--white);border-radius:24px;padding:18px;margin-bottom:12px}
.kpi span{font-size:12px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.02em}
.kpi b{display:block;font-family:var(--mono);font-size:30px;line-height:36px;letter-spacing:-.02em;color:var(--lime);margin-top:6px}
.kpi small{display:block;margin-top:6px;font-size:13px;color:rgba(255,255,255,.75)}
.up{color:var(--lime);font-weight:700}
.down{color:var(--coral);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.card{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.card span{font-size:12px;color:var(--muted);font-weight:600;display:block}
.card b{display:block;font-family:var(--mono);font-size:20px;margin-top:6px;letter-spacing:-.01em}
.card small{font-size:12px;color:var(--muted);display:block;margin-top:4px}
.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);font-weight:700;margin:20px 0 10px}
.chart{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:14px 12px 10px}
.chart svg{width:100%;height:auto;display:block}
.rank{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:6px 16px}
.rk{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border:0}
.rk .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rk .t{font-size:14px;font-weight:600}
.rk .bar{height:6px;border-radius:999px;background:var(--paper);margin-top:6px;overflow:hidden}
.rk .bar div{height:100%;background:var(--lime);border-radius:999px}
.rk .v{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right}
.rk .v small{display:block;font-size:11px;color:var(--muted);font-family:var(--font);font-weight:500}
.tbl{width:100%;border-collapse:collapse;background:var(--white);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);font-size:12px}
.tbl th{text-align:right;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.04em;padding:10px 6px;border-bottom:1px solid var(--line);text-transform:uppercase}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono)}
.tbl td:first-child{font-family:var(--font);font-weight:600}
.tbl tr:last-child td{border:0}
.scroll{overflow-x:auto;margin:0 -20px;padding:0 20px}
.notice{border-radius:18px;padding:12px 14px;font-size:13px;line-height:19px;margin-top:12px;background:#E3EEFF;color:#1B4D9B}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:999px;border:0;font-weight:600;font-size:15px;margin-top:14px;background:var(--forest);color:var(--white)}
.btn-ghost{background:transparent;color:var(--forest-deep);box-shadow:inset 0 0 0 1.5px var(--forest-deep)}
.pdf-name{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;text-align:center;word-break:break-all}
.nav{flex:none;background:var(--white);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 22px;position:relative}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);min-height:48px;padding-top:2px;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--forest)}
.tab.on::before{content:"";position:absolute;top:-8px;width:28px;height:3px;border-radius:999px;background:var(--lime)}
.toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--forest);color:var(--white);padding:12px 16px;border-radius:16px;font-size:14px;font-weight:600;text-align:center;z-index:30}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="demo-bar">
  <label for="scenario">Scénario de démonstration</label>
  <select id="scenario" onchange="setScenario(this.value)">
    <option value="month">Mois en cours (octobre 2026)</option>
    <option value="year">Année 2026 (depuis janvier)</option>
  </select>
</div>

<div class="phone">
  <div class="status"><span>9:41</span><span class="mono" style="font-size:12px">●●● 5G</span></div>
  <div class="head"><h1>Statistiques</h1><p id="sub">Octobre 2026 · journées commerciales</p></div>
  <div class="controls">
    <select class="picker" id="barSel" onchange="render()"></select>
    <div class="seg" id="periodSeg"></div>
  </div>
  <div class="content" id="content"></div>
  <nav class="nav" id="nav"></nav>
  <div class="toast hide" id="toast"></div>
</div>

<script>
// ---------- Données (octobre 2026, bouteilles et francs, tous bars confondus = Chez Mama + Centre) ----------
const F=n=>Math.round(n).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ')+' F';
const N=n=>Math.round(n).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ');
// bouteilles vendues, CA, coût d'achat par bouteille, casse en bouteilles (mois en cours, Chez Mama Africa)
const PROD=[
 {n:'Castel 65 cl',b:620,ca:496000,pa:700,casse:2},
 {n:'Coca-Cola 33 cl',b:960,ca:320000,pa:240,casse:0,promo:true},
 {n:'Fanta 33 cl',b:600,ca:200000,pa:240,casse:0,promo:true},
 {n:'Beaufort 65 cl',b:480,ca:384000,pa:675,casse:0},
 {n:'Sprite 33 cl',b:480,ca:192000,pa:240,casse:0},
 {n:'Heineken 33 cl',b:410,ca:328000,pa:600,casse:0},
 {n:'Possotomè 50 cl',b:560,ca:168000,pa:200,casse:0},
 {n:'Cristal 50 cl',b:520,ca:156000,pa:200,casse:0},
 {n:'Cristal 1,5 L',b:360,ca:180000,pa:300,casse:0},
 {n:'La Béninoise 65 cl',b:300,ca:210000,pa:650,casse:0},
 {n:'Possotomè 1,5 L',b:240,ca:120000,pa:300,casse:0},
 {n:'Top Ananas 33 cl',b:240,ca:96000,pa:230,casse:0}
];
// Centre : annexe, environ 40 % du volume
const FACTOR={chez:1,centre:0.4};
const BARS={all:'Tous mes bars',chez:'Buvette Chez Mama Africa',centre:'Buvette Centre (annexe)'};
const PREV_MONTH_CA=2530000;  // septembre 2026, tous bars
// CA mensuel 2026 (tous bars). Oct = mois en cours
const MONTHS=[['Jan',1900000],['Fév',1800000],['Mar',2100000],['Avr',2200000],['Mai',2300000],['Juin',2400000],['Juil',2200000],['Août',2400000],['Sep',2530000],['Oct',2850000]];
let period='month', bar='all', tickCancelled=2;

// ---------- Calculs ----------
function total(){ const f=bar==='all'?1.4:FACTOR[bar]; return {
  ca:2850000*f, ben:PROD.reduce((a,p)=>a+(p.ca-p.pa*p.b),0)*f, casse:PROD.reduce((a,p)=>a+p.casse*p.pa,0)*f,
  bottles:PROD.reduce((a,p)=>a+p.b,0)*f }; }
function monthlyCa(){ const f=bar==='all'?1.4:FACTOR[bar]; return MONTHS.map(([m,v])=>[m,v*f]); }
function prodFor(){ const f=bar==='all'?1.4:FACTOR[bar]; return PROD.map(p=>({...p,b:Math.round(p.b*f),ca:Math.round(p.ca*f),casse:Math.round(p.casse*f),pa:p.pa})); }

// Journée commerciale (4 h à 3 h 59) : courbe quotidienne du mois, normalisée au total du mois
function dailySeries(){
  const w=[0.7,0.8,0.75,0.9,0.85,1.0,1.25,1.1,0.95,0.9,1.05,1.2,1.15,1.0,0.95,1.1,1.3,1.2,1.05,0.92,1.0,1.15,1.25,1.3,1.1,0.98,1.02,1.06,1.12];
  const sum=w.reduce((a,b)=>a+b,0); const f=bar==='all'?1.4:FACTOR[bar]; const tot=2850000*f;
  return w.map((x,i)=>[i+1, tot*x/sum]);
}

// ---------- Rendu ----------
const SEG=[['month','Mois'],['year','Année']];
function renderSeg(){ document.getElementById('periodSeg').innerHTML=SEG.map(([k,l])=>`<button class="${period===k?'on':''}" onclick="setPeriod('${k}')">${l}</button>`).join(''); }
function setPeriod(k){ period=k; render(); }
function setScenario(v){ period=v; document.getElementById('barSel').value='all'; bar='all'; render(); }
function fillBars(){ document.getElementById('barSel').innerHTML=Object.entries(BARS).map(([k,l])=>`<option value="${k}">${l}</option>`).join(''); document.getElementById('barSel').value=bar; }
function render(){
  bar=document.getElementById('barSel').value||'all';
  renderSeg();
  document.getElementById('sub').textContent = period==='month' ? 'Octobre 2026 · journées commerciales' : 'Année 2026 · janvier à octobre';
  document.getElementById('content').innerHTML = period==='month' ? monthView() : yearView();
  renderNav();
}
function renderNav(){
  const tabs=[['Accueil','M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],['Ventes','M6 3h12v18l-3-2-3 2-3-2-3 2z'],['Stock','M3 4h18v5H3zM5 9v10h14V9'],['Inventaire','M9 5h10M9 12h10M9 19h10'],['Plus','M5 12h.01M12 12h.01M19 12h.01']];
  document.getElementById('nav').innerHTML=tabs.map(([l,d],i)=>`<button class="tab ${i===4?'on':''}" onclick="toast('${l} : écran du fichier suivant')"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${l}</button>`).join('');
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hide'); clearTimeout(window.__t); window.__t=setTimeout(()=>t.classList.add('hide'),2200); }

function kpis(t, compare){
  const pct = compare.pct;
  return `<div class="kpi"><span>Chiffre d'affaires ${period==='month'?'du mois':'de l\'année'}</span>
     <b>${F(t.ca)}</b><small>${compare.label} <span class="${pct>=0?'up':'down'}">${pct>=0?'+':''}${pct.toFixed(1).replace('.',',')} %</span></small></div>
   <div class="two">
     <div class="card"><span>Bénéfice brut</span><b>${F(t.ben)}</b><small>Avant casse</small></div>
     <div class="card"><span>Bouteilles vendues</span><b>${N(t.bottles)}</b><small>Tickets annulés exclus</small></div>
   </div>
   <div class="card" style="margin-bottom:12px"><span>Casse de la période</span><b>${F(t.casse)}</b><small>Affichée séparément, perte de la buvette</small></div>`;
}
function monthView(){
  const t=total(); const f=bar==='all'?1.4:FACTOR[bar];
  const pct=(2850000-PREV_MONTH_CA)/PREV_MONTH_CA*100;
  const k=kpis({ca:2850000*f, ben:t.ben, casse:t.casse, bottles:t.bottles}, {pct, label:'vs septembre'});
  const daily=dailySeries();
  const max=Math.max(...daily.map(d=>d[1]));
  // courbe SVG
  const W=320,H=150,pad=10; const pts=daily.map(([d,v],i)=>[pad+i*(W-2*pad)/(daily.length-1), H-pad-(v/max)*(H-2*pad)]);
  const path='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  const area=path+` L${W-pad} ${H-pad} L${pad} ${H-pad} Z`;
  const chart=`<div class="chart"><svg viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Chiffre d'affaires par jour">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8BFA5A" stop-opacity=".35"/><stop offset="1" stop-color="#8BFA5A" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#DCE6DD"/>
    <path d="${area}" fill="url(#g)"/><path d="${path}" fill="none" stroke="#0B3322" stroke-width="2.2" stroke-linejoin="round"/>
    ${[1,8,15,22,29].map((d,i)=>{const x=pad+(d-1)*(W-2*pad)/(daily.length-1); return `<text x="${x}" y="${H+12}" font-size="9" fill="#5E7266" text-anchor="middle">${d}</text>`;}).join('')}
  </svg><div style="font-size:12px;color:var(--muted);margin-top:4px">Chiffre d'affaires par jour, en octobre</div></div>`;
  const ranked=[...prodFor()].sort((a,b)=>b.b-a.b);
  const maxB=ranked[0].b;
  const rank=`<div class="rank">${ranked.slice(0,6).map((p,i)=>`<div class="rk"><span class="n">${i+1}</span><div><div class="t">${p.n}</div><div class="bar"><div style="width:${p.b/maxB*100}%"></div></div></div><div class="v">${N(p.b)} b.<small>${F(p.ca)}</small></div></div>`).join('')}</div>`;
  const rows=prodFor().map(p=>{const ben=p.ca-p.pa*p.b; return `<tr><td>${p.n}</td><td>${N(p.b)}</td><td>${F(p.ca).replace(' F','')}</td><td>${F(ben).replace(' F','')}</td></tr>`;}).join('');
  return `${k}
    <div class="sec">Évolution</div>${chart}
    <div class="sec">Classement · bouteilles vendues</div>${rank}
    <div class="sec">Détail par boisson</div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Boisson</th><th>Bouteilles</th><th>CA</th><th>Bénéfice brut</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="notice">Les statistiques utilisent les journées commerciales (4 h à 3 h 59). Les ${tickCancelled} tickets annulés sont exclus.</div>
    ${pdfBlock()}`;
}
function yearView(){
  const f=bar==='all'?1.4:FACTOR[bar];
  const ytd=MONTHS.reduce((a,[,v])=>a+v,0)*f;
  const pct=5.8; // comparaison à la même période de 2025 (démo)
  const yf=22680000/2850000;   // année (janvier à octobre) rapportée au mois d'octobre
  const t=total();
  const k=kpis({ca:ytd, ben:t.ben*yf, casse:t.casse*yf, bottles:t.bottles*yf}, {pct, label:'vs même période 2025'});
  const data=monthlyCa(); const max=Math.max(...data.map(d=>d[1]));
  const W=320,H=150,pad=10,bw=(W-2*pad)/data.length-6;
  const bars=data.map(([m,v],i)=>{ const h=(v/max)*(H-2*pad-14); const x=pad+i*((W-2*pad)/data.length)+3; const y=H-pad-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${i===data.length-1?'#8BFA5A':'#0B3322'}"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${H+8}" font-size="8.5" fill="#5E7266" text-anchor="middle">${m}</text>`;}).join('');
  const chart=`<div class="chart"><svg viewBox="0 0 ${W} ${H+14}" role="img" aria-label="Chiffre d'affaires par mois">${bars}</svg><div style="font-size:12px;color:var(--muted);margin-top:4px">Chiffre d'affaires par mois, en 2026</div></div>`;
  const ranked=[...prodFor()].map(p=>({...p,yb:Math.round(p.b*yfY()),yca:Math.round(p.ca*yfY())})).sort((a,b)=>b.yb-a.yb);
  const maxB=ranked[0].yb;
  const rank=`<div class="rank">${ranked.slice(0,6).map((p,i)=>`<div class="rk"><span class="n">${i+1}</span><div><div class="t">${p.n}</div><div class="bar"><div style="width:${p.yb/maxB*100}%"></div></div></div><div class="v">${N(p.yb)} b.<small>${F(p.yca)}</small></div></div>`).join('')}</div>`;
  const rows=ranked.map(p=>{const ben=p.yca-p.pa*p.yb; return `<tr><td>${p.n}</td><td>${N(p.yb)}</td><td>${F(p.yca).replace(' F','')}</td><td>${F(ben).replace(' F','')}</td></tr>`;}).join('');
  return `${k}
    <div class="sec">Chiffre d'affaires par mois</div>${chart}
    <div class="sec">Classement · bouteilles vendues</div>${rank}
    <div class="sec">Détail par boisson, année</div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Boisson</th><th>Bouteilles</th><th>CA</th><th>Bénéfice brut</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="notice">Les statistiques utilisent les journées commerciales. Les tickets annulés sont exclus.</div>
    ${pdfBlock()}`;
}
function yfY(){ return 22680000/2850000; }
function pdfBlock(){
  const label = BARS[bar];
  const name = `Statistiques_${bar==='all'?'TousLesBars':label.includes('Centre')?'BuvetteCentre':'ChezMamaAfrica'}_${period==='month'?'2026-10':'2026'}.pdf`;
  return `<button class="btn" onclick="toast('PDF généré : ${name}')">Télécharger le rapport statistiques</button>
    <div class="pdf-name">${name}</div>
    <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px">En-tête : ${label} · période · date de génération</div>`;
}

fillBars();
render();
</script>
</body>
</html>
